<svg width="1400" height="940" viewBox="0 0 1400 940" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ML Research Assistant Architecture — corrected with scope guard, reranker, and calibrated threshold routing</title>
<desc>Six-layer architecture diagram showing the user interface, scope guard, agent orchestration, retrieval and reranking, threshold-based routing, and fallback/final response layers, with an accurate technology stack.</desc>
<defs>
  <marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#7FA8D9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="1400" height="940" fill="#0A1830"/>

<text x="700" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="800" text-anchor="middle" fill="#4FC3F7">ML Research Assistant Architecture</text>
<text x="700" y="85" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#93A9C8">Multi-Agent RAG Pipeline with Deterministic Routing &amp; Calibrated Confidence</text>

<!-- ===== ROW BANDS ===== -->
<g font-family="Arial, sans-serif">

