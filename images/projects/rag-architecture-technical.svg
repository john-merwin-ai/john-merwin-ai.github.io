<rect x="40" y="120" width="1320" height="100" rx="14" fill="#0F2038" stroke="#1E3A5F" stroke-width="1"/>
<text x="60" y="158" font-size="17" font-weight="700" fill="#29B6F6">Layer 1 —</text>
<text x="60" y="182" font-size="17" font-weight="700" fill="#29B6F6">User Interface</text>

<rect x="310" y="140" width="170" height="58" rx="8" fill="#12283F" stroke="#29B6F6" stroke-width="1.2"/>
<text x="395" y="163" font-size="13" font-weight="700" text-anchor="middle" fill="#EAF3FC">User / Learner</text>
<text x="395" y="180" font-size="10" text-anchor="middle" fill="#93A9C8">Chat participant</text>

<line x1="480" y1="169" x2="510" y2="169" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
<rect x="515" y="140" width="170" height="58" rx="8" fill="#12283F" stroke="#29B6F6" stroke-width="1.2"/>
<text x="600" y="163" font-size="13" font-weight="700" text-anchor="middle" fill="#EAF3FC">Chat Interface</text>
<text x="600" y="180" font-size="10" text-anchor="middle" fill="#93A9C8">Message thread</text>

<line x1="685" y1="169" x2="715" y2="169" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
<rect x="720" y="140" width="200" height="58" rx="8" fill="#12283F" stroke="#29B6F6" stroke-width="1.2"/>
<text x="820" y="163" font-size="13" font-weight="700" text-anchor="middle" fill="#EAF3FC">Streamlit App</text>
<text x="820" y="180" font-size="10" text-anchor="middle" fill="#93A9C8">Web front-end</text>

<path d="M948 158 L953 163 L961 152" fill="none" stroke="#2ECC91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="968" y="163" font-size="12" font-weight="700" fill="#2ECC91">Grounded retrieval</text>
<path d="M948 180 L953 185 L961 174" fill="none" stroke="#2ECC91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="968" y="185" font-size="12" font-weight="700" fill="#2ECC91">Calibrated confidence</text>

<!-- ROW 2: Scope Guard (NEW) -->
<rect x="40" y="235" width="1320" height="100" rx="14" fill="#0F2038" stroke="#1E3A5F" stroke-width="1"/>
<text x="60" y="273" font-size="17" font-weight="700" fill="#2ECC91">Layer 2 —</text>
<text x="60" y="297" font-size="17" font-weight="700" fill="#2ECC91">Scope Guard</text>

<rect x="310" y="255" width="180" height="58" rx="8" fill="#12283F" stroke="#2ECC91" stroke-width="1.2"/>
<text x="400" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#EAF3FC">User Question</text>
<text x="400" y="295" font-size="10" text-anchor="middle" fill="#93A9C8">Raw input text</text>

<line x1="490" y1="284" x2="520" y2="284" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
<rect x="525" y="255" width="220" height="58" rx="8" fill="#12283F" stroke="#2ECC91" stroke-width="1.5"/>
<text x="635" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#EAF3FC">Scope Guard Agent</text>
<text x="635" y="295" font-size="10" text-anchor="middle" fill="#93A9C8">AI/ML topic classifier</text>

<line x1="745" y1="278" x2="775" y2="278" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
<text x="785" y="272" font-size="12" font-weight="700" fill="#2ECC91">YES &#8594; continue to retrieval</text>
<line x1="745" y1="292" x2="775" y2="292" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
<text x="785" y="298" font-size="12" font-weight="700" fill="#9FB3CC">NO &#8594; decline, no retrieval call</text>

