<text x="555" y="614" font-size="11" font-weight="700" fill="#2ECC91">YES</text>
<rect x="555" y="600" width="180" height="58" rx="8" fill="#12283F" stroke="#2ECC91" stroke-width="1.2"/>
<text x="645" y="623" font-size="12" font-weight="700" text-anchor="middle" fill="#EAF3FC">Citation Validation</text>
<text x="645" y="640" font-size="10" text-anchor="middle" fill="#93A9C8">Enforces citations</text>

<line x1="735" y1="629" x2="765" y2="629" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
<rect x="770" y="600" width="220" height="58" rx="8" fill="#12283F" stroke="#2ECC91" stroke-width="1.2"/>
<text x="880" y="623" font-size="12" font-weight="700" text-anchor="middle" fill="#EAF3FC">LLM Response Generation</text>
<text x="880" y="640" font-size="10" text-anchor="middle" fill="#93A9C8">GPT-4o-mini, grounded</text>
<path d="M760 664 L765 669 L773 658" fill="none" stroke="#2ECC91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="780" y="669" font-size="11" font-weight="700" fill="#2ECC91">Prevents unsupported answers</text>

<text x="415" y="670" font-size="11" font-weight="700" fill="#9FB3CC">NO &#8595; web fallback</text>

