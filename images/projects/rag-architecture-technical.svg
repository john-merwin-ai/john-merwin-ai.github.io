<text x="402" y="508" font-size="12" font-weight="700" text-anchor="middle" fill="#EAF3FC">Embedding Generation</text>
<text x="402" y="525" font-size="10" text-anchor="middle" fill="#93A9C8">text-embedding-3-small</text>

<line x1="495" y1="514" x2="515" y2="514" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
<rect x="520" y="485" width="160" height="58" rx="8" fill="#12283F" stroke="#E8A33D" stroke-width="1.2"/>
<text x="600" y="508" font-size="13" font-weight="700" text-anchor="middle" fill="#EAF3FC">pgvector (Neon)</text>
<text x="600" y="525" font-size="10" text-anchor="middle" fill="#93A9C8">Postgres vector DB</text>

<line x1="680" y1="514" x2="700" y2="514" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
