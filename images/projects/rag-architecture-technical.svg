<rect x="40" y="350" width="1320" height="100" rx="14" fill="#0F2038" stroke="#1E3A5F" stroke-width="1"/>
<text x="60" y="388" font-size="17" font-weight="700" fill="#5B8DEF">Layer 3 —</text>
<text x="60" y="412" font-size="17" font-weight="700" fill="#5B8DEF">Orchestration</text>

<rect x="310" y="370" width="190" height="58" rx="8" fill="#12283F" stroke="#5B8DEF" stroke-width="1.2"/>
<text x="405" y="393" font-size="13" font-weight="700" text-anchor="middle" fill="#EAF3FC">Retrieval Agent</text>
<text x="405" y="410" font-size="10" text-anchor="middle" fill="#93A9C8">Explicit search calls</text>

<line x1="500" y1="399" x2="525" y2="399" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
<rect x="530" y="370" width="230" height="58" rx="8" fill="#12283F" stroke="#5B8DEF" stroke-width="1.2"/>
<text x="645" y="393" font-size="13" font-weight="700" text-anchor="middle" fill="#EAF3FC">Agno AI Orchestrator</text>
<text x="645" y="410" font-size="10" text-anchor="middle" fill="#93A9C8">Coordinates all agents</text>

<line x1="760" y1="399" x2="785" y2="399" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
<rect x="790" y="370" width="210" height="58" rx="8" fill="#12283F" stroke="#B076E0" stroke-width="1.2"/>
<text x="895" y="393" font-size="13" font-weight="700" text-anchor="middle" fill="#EAF3FC">Web Research Agent</text>
<text x="895" y="410" font-size="10" text-anchor="middle" fill="#93A9C8">Live search fallback</text>

<rect x="1030" y="370" width="200" height="58" rx="8" fill="#12283F" stroke="#E8A33D" stroke-width="1.2"/>
<text x="1130" y="393" font-size="13" font-weight="700" text-anchor="middle" fill="#EAF3FC">Indexed Textbooks</text>
<text x="1130" y="410" font-size="10" text-anchor="middle" fill="#93A9C8">2 curated source texts</text>
<line x1="1025" y1="399" x2="1000" y2="399" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>

