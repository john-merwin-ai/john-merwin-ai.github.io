<line x1="500" y1="744" x2="520" y2="744" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
<rect x="525" y="715" width="140" height="58" rx="8" fill="#12283F" stroke="#B076E0" stroke-width="1.2"/>
