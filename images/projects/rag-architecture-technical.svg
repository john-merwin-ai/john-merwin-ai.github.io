<text x="970" y="525" font-size="10" text-anchor="middle" fill="#93A9C8">rerank-v3.5 rescoring</text>

<line x1="1060" y1="514" x2="1080" y2="514" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
