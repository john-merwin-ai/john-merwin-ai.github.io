<line x1="665" y1="744" x2="685" y2="744" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
<rect x="690" y="715" width="200" height="58" rx="8" fill="#12283F" stroke="#B076E0" stroke-width="1.2"/>
<text x="790" y="738" font-size="12" font-weight="700" text-anchor="middle" fill="#EAF3FC">Trusted Sources</text>
<text x="790" y="755" font-size="10" text-anchor="middle" fill="#93A9C8">External web results</text>

<line x1="890" y1="744" x2="910" y2="744" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
<rect x="915" y="715" width="180" height="58" rx="8" fill="#12283F" stroke="#B076E0" stroke-width="1.2"/>
<text x="1005" y="738" font-size="12" font-weight="700" text-anchor="middle" fill="#EAF3FC">Summarized Response</text>
<text x="1005" y="755" font-size="10" text-anchor="middle" fill="#93A9C8">Synthesized answer</text>

<line x1="1095" y1="744" x2="1115" y2="744" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
<rect x="1120" y="715" width="190" height="58" rx="8" fill="#12283F" stroke="#9FB3CC" stroke-width="1.4"/>
<text x="1215" y="738" font-size="13" font-weight="700" text-anchor="middle" fill="#EAF3FC">Final Response</text>
<text x="1215" y="755" font-size="10" text-anchor="middle" fill="#93A9C8">Answer + citations</text>

