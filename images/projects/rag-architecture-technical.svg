<text x="780" y="508" font-size="13" font-weight="700" text-anchor="middle" fill="#EAF3FC">Similarity Search</text>
<text x="780" y="525" font-size="10" text-anchor="middle" fill="#93A9C8">Cosine similarity</text>

<line x1="855" y1="514" x2="875" y2="514" stroke="#7FA8D9" stroke-width="1.5" marker-end="url(#arrowD)"/>
